<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Backend</title>
</head>

<body>
    <p id="userr">USER HERE</p>
    <form id="login-form">
        <input type="text" id="login-username" placeholder="Username" required>
        <input type="password" id="login-password" placeholder="Password" required>

        <button type="submit">Log in</button>
        <p id="login-message"></p>
    </form>

    <form id="create-user-form">
        <input type="text" id="new-username" placeholder="Username" required>
        <input type="email" id="new-email" placeholder="Email" required>
        <input type="password" id="new-password" placeholder="Password" required>
        <input type="text" id="new-name" placeholder="Full name" required>
    
        <button type="submit">Create account</button>
        <p id="create-user-message"></p>
    </form>

    <script>
                const pUserr = document.getElementById("userr");

        const API_URL = "https://api.ludesign.ca";

        document.getElementById("login-form").addEventListener("submit", async (event) => {
            event.preventDefault();

            const username = document.getElementById("login-username").value;
            const password = document.getElementById("login-password").value;
            const message = document.getElementById("login-message");

            try {
                const response = await fetch(`${API_URL}/login`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    credentials: "include",
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    message.textContent = "Login successful!";
                    // Example: window.location.href = "/cms.html";
                } else {
                    message.textContent = data.error || "Login failed.";
                }
            } catch (error) {
                message.textContent = "Could not connect to the server.";
                console.error(error);
            }
        });

        document.getElementById("create-user-form").addEventListener("submit", async (event) => {
            event.preventDefault();

            const username = document.getElementById("new-username").value;
            const email = document.getElementById("new-email").value;
            const password = document.getElementById("new-password").value;
            const name = document.getElementById("new-name").value;
            const message = document.getElementById("create-user-message");

            try {
                const response = await fetch(`${API_URL}/createUser`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ username, email, password, name })
                });

                const data = await response.json();

                if (response.ok) {
                    message.textContent = "Account created successfully!";
                } else {
                    message.textContent = data.error || "Could not create account.";
                }
            } catch (error) {
                message.textContent = "Could not connect to the server.";
                console.error(error);
            }
        });
        async function checkLogin() {
    try {
        const response = await fetch(`${API_URL}/me`, {
            credentials: "include"
        });

        if (!response.ok) {
            console.log("User is not logged in.");
            pUserr.textContent = "No user";
            return;
        }

        const data = await response.json();

        console.log("Already logged in:", data.user);
         pUserr.textContent = data.user.username;

        // Example:
        // Show the CMS if the user is authorized.
    } catch (error) {
        console.error("Could not check login:", error);
    }
}

checkLogin();
    </script>
</body>

</html>
