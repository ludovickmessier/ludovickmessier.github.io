
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Backend</title>
</head>
<body>
    <p id="text"></p>

    <script>
        fetch("https://backend-wt9y.onrender.com/api/users")
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error: ${response.status}`);
                }
                return response.json();
            })
            .then(users => {
                document.getElementById("text").textContent =
                    JSON.stringify(users);
            })
            .catch(error => {
                document.getElementById("text").textContent =
                    "Error: " + error.message;
                console.error(error);
            });
    </script>
</body>
</html>
